<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recap photos</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:auto;padding:12px;max-width:640px}
section{border:1px solid #ccc;border-radius:10px;padding:12px;margin:12px 0}
h2{font-size:1.05rem;margin:0 0 8px}.err{background:#fdd;padding:8px;border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.ph{width:96px;text-align:center}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:6px}
button{font-size:1rem;padding:8px 12px}input[type=file]{font-size:1rem;max-width:100%}
</style></head><body>
<h1 style="font-size:1.2rem">$title</h1>
$error
$sections
</body></html>
