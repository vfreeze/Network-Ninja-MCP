<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Recap photos</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#16181d;--muted:#5d6470;--line:#dde0e5;--accent:#1f6feb;--accent-text:#fff;
  --ok-bg:#e3f4e8;--ok:#1a7f37;--err-bg:#fdecec;--err:#b42318;--note-bg:#e8f0fe}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--text:#eceef2;--muted:#9aa1ad;--line:#2c3038;
  --accent:#4c8dff;--accent-text:#0b0d10;--ok-bg:#16301f;--ok:#5fd17f;--err-bg:#3a1b1b;--err:#ff8a80;--note-bg:#1b2a45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  padding:16px 16px 0}
main{max-width:560px;margin:auto}
h1{font-size:1.35rem;margin:4px 0 2px}.sub{color:var(--muted);margin:0 0 16px}
.msg{border-radius:12px;padding:12px 14px;margin:0 0 14px}.err{background:var(--err-bg);color:var(--err)}
.ok{background:var(--ok-bg);color:var(--ok)}.note{background:var(--note-bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
h2{font-size:1rem;margin:0}.badge{flex:none;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;
  background:var(--bg);color:var(--muted)}.badge.done{background:var(--ok-bg);color:var(--ok)}
.hint{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.thumbs,.chosen{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs:not(:empty),.chosen:not(:empty){margin-top:12px}
.ph{position:relative;margin:0}.ph img,.chosen img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.chosen img{outline:3px solid var(--accent);outline-offset:-3px}
.ph form{position:absolute;top:4px;right:4px;margin:0}
.x{width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.pick{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:12px;border:2px dashed var(--line);
  border-radius:12px;color:var(--accent);font-weight:600;cursor:pointer}
.pick:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.bar{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line)}
.bar button{display:block;width:100%;max-width:560px;margin:auto;min-height:52px;border:0;border-radius:14px;
  background:var(--accent);color:var(--accent-text);font-family:inherit;font-size:1.05rem;font-weight:600;cursor:pointer}
.bar button:disabled{opacity:.45;cursor:default}
</style></head><body><main>
<h1>$title</h1>
<p class="sub">$when<br>Add your photos below, then tap <b>Upload</b> once at the bottom.</p>
$notice
$sections
<p class="msg note">Done? Go back to Claude and say you've uploaded your photos. This link works for an hour.</p>
<form id="up" method="post" action="$action" enctype="multipart/form-data"></form>
</main>
<div class="bar"><button form="up" id="go">Upload photos</button></div>
<script>
(function(){
  var go = document.getElementById('go');
  var inputs = document.querySelectorAll('input[type=file]');
  function refresh(){
    var n = 0;
    inputs.forEach(function(i){ n += i.files.length; });
    go.disabled = !n;
    go.textContent = n ? 'Upload ' + n + (n === 1 ? ' photo' : ' photos') : 'Choose photos above';
  }
  inputs.forEach(function(i){
    i.addEventListener('change', function(){
      var box = i.closest('.card').querySelector('.chosen');
      box.innerHTML = '';
      Array.prototype.forEach.call(i.files, function(f){
        var img = document.createElement('img'); img.alt = ''; img.src = URL.createObjectURL(f); box.appendChild(img);
      });
      refresh();
    });
  });
  document.getElementById('up').addEventListener('submit', function(){
    setTimeout(function(){ go.disabled = true; go.textContent = 'Uploading… keep this page open'; }, 0);
  });
  document.querySelectorAll('form.rm').forEach(function(f){
    f.addEventListener('submit', function(e){ if (!confirm('Remove this photo?')) e.preventDefault(); });
  });
  refresh();
})();
</script>
</body></html>
